set -s escape-time 0
set -g focus-events on
set -s set-clipboard on
set -gq allow-passthrough on
set -g visual-activity off
set -g renumber-windows on

set -g mouse on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -ga terminal-features ",xterm*:RGB"   # 启用 RGB 颜色
set -ga terminal-overrides ",xterm*:Tc"   # 启用真彩色
set -ga terminal-features ",xterm*:sixel" # 启用 Sixel 图形

set -g prefix C-b            # 设置 Ctrl-z 为主前缀

bind -r z resize-pane -Z  # prefix+z → 切换全屏
bind -r h select-pane -L  # prefix+h → 移到左窗格
bind -r j select-pane -D  # prefix+j → 移到下窗格
bind -r k select-pane -U  # prefix+k → 移到上窗格
bind -r l select-pane -R  # prefix+l → 移到右窗格

bind s split-window -v -c "#{pane_current_path}"  # 水平分割，保持当前路径
bind v split-window -h -c "#{pane_current_path}"  # 垂直分割，保持当前路径

# unbind right mouse click
unbind -n MouseDown3Pane


# --- Status Bar ---
set -g status on                    # Enable status bar
set -g status-justify centre        # Center window list
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S "
set -g status-right "#[bg=#32344a,fg=#acb0d0] %H:%M #[bg=#1a1b26]#{tmux_mode_indicator}"

setw -g pane-border-status top
setw -g pane-border-format '#{pane_index} #{pane_current_command} #{b:pane_current_path}'
set -g pane-border-style 'fg=#787c99'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'
set -g message-style 'bg=#e0af68,fg=#1a1b26'
set -g message-command-style 'bg=#7aa2f7,fg=#1a1b26'
set -g mode-style 'bg=#ff9e64,fg=#1a1b26'

setw -g window-status-separator ' '
# Window number shows orange when Claude is thinking, otherwise normal gray
setw -g window-status-format '#[bg=#1a1b26,fg=#787c99]#{window_index} #[fg=#787c99]#W'
setw -g window-status-current-format '#[bg=#444b6a,fg=#acb0d0,bold]#{window_index} #[fg=#7aa2f7]#W'
setw -g window-status-activity-style 'fg=#ff9e64,bg=#1a1b26'
setw -g window-status-bell-style 'fg=#ad8ee6,bg=#1a1b26'



# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

# --- tmux-yank settings ---
# Use OSC 52 for remote clipboard support
set -g @yank_action 'copy-pipe'
set -g @yank_with_mouse on

# --- tmux-mode-indicator settings ---
set -g @mode_indicator_prefix_prompt ' WAIT '
set -g @mode_indicator_copy_prompt ' COPY '
set -g @mode_indicator_sync_prompt ' SYNC '
set -g @mode_indicator_empty_prompt ' TMUX '
set -g @mode_indicator_prefix_mode_style 'bg=#9ece6a,fg=#1a1b26'
set -g @mode_indicator_copy_mode_style 'bg=#ff9e64,fg=#1a1b26'
set -g @mode_indicator_sync_mode_style 'bg=#f7768e,fg=#1a1b26'
set -g @mode_indicator_empty_mode_style 'bg=#444b6a,fg=#a9b1d6'



run '~/.tmux/plugins/tpm/tpm'
